server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: digital-wallet-api

  datasource:
    url: jdbc:postgresql://localhost:5432/digital_wallet_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: create     # FIRST RUN: 'create' — switch to 'validate' after tables exist
    show-sql: false         # flip to true when debugging queries locally
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgresSQLDialect
        format_sql: true
    open-in-view: false     # always off in a REST API

  # Flyway will handle schema migrations (wired up in Phase 2+)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# JWT config — override these via env vars in prod, never commit real secrets
app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_USE_A_256_BIT_SECRET_KEY_HERE}
    expiration-ms: 86400000        # 24 hours
    refresh-expiration-ms: 604800000  # 7 days

# Swagger UI will be at /api/swagger-ui.html
spring doc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.digital wallet: DEBUG
    org.springframework.security: INFO
